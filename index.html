<!doctype html>
<html>
  <head>
    <title>Cool 2d Game</title>
    <meta name="viewport" />
    <style>
      canvas {
        display: block;
        image-rendering: pixelated;
        width: 90vw;
        height: auto;
        max-width: 90vw;
        max-height: 90vh;
        aspect-ratio: 1920 / 1024;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" style="width: 90vw; height: 90vh"></canvas>

    <script>
      // |-------------------------------|
      // |      START OF AI SECTION      |
      // |-------------------------------|

      // Returns a float in [0, 1), like Math.random(), but seeded
      function next() {
        state = (state + 0x6d2b79f5) >>> 0;
        let t = state;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }

      // Random float between min and max
      function r(min, max) {
        return min + next() * (max - min);
      }

      // Random integer between min and max, inclusive
      function random(min, max) {
        return Math.floor(r(min, max + 1));
      }

      function inBounds(x, y) {
        // written by AI

        return x >= 0 && x < xCellCount && y >= 0 && y < yCellCount;
      }

      function getTile(x, y) {
        // written by AI

        return inBounds(x, y) ? map[y][x] : null; // null = outside the world
      }

      function setTile(x, y, id) {
        // written by AI

        if (inBounds(x, y)) map[y][x] = id;
      }

      function rect(x, y, width, height, color = "black", strokeColor = "black", strokeWidth = 0) {
        // written by AI
        ctx.fillStyle = color;
        ctx.fillRect(x, y, width, height);

        if (strokeWidth > 0) {
          ctx.lineWidth = strokeWidth;
          ctx.strokeStyle = strokeColor;
          ctx.strokeRect(x, y, width, height);
        }
      }

      function hash(x, y) {
        let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + seedInt) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
      }

      function resize() {
        // written by AI
        const scale = Math.min(window.innerWidth / canvas.width, window.innerHeight / canvas.height);
        canvas.style.width = canvas.width * scale + "px";
        canvas.style.height = canvas.height * scale + "px";
      }

      function hslToRgb({ h, s, l }) {
        // Normalize hue to [0, 360) and percentages to [0, 1]
        h = ((h % 360) + 360) % 360;
        s /= 100;
        l /= 100;

        const c = (1 - Math.abs(2 * l - 1)) * s;
        const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
        const m = l - c / 2;

        let r = 0,
          g = 0,
          b = 0;

        if (0 <= h && h < 60) {
          r = c;
          g = x;
          b = 0;
        } else if (60 <= h && h < 120) {
          r = x;
          g = c;
          b = 0;
        } else if (120 <= h && h < 180) {
          r = 0;
          g = c;
          b = x;
        } else if (180 <= h && h < 240) {
          r = 0;
          g = x;
          b = c;
        } else if (240 <= h && h < 300) {
          r = x;
          g = 0;
          b = c;
        } else if (300 <= h && h < 360) {
          r = c;
          g = 0;
          b = x;
        }

        return {
          r: Math.round((r + m) * 255),
          g: Math.round((g + m) * 255),
          b: Math.round((b + m) * 255),
        };
      }

      // |-----------------------------|
      // |      END OF AI SECTION      |
      // |-----------------------------|

      const canvas = document.getElementById("canvas");
      window.addEventListener("resize", resize);
      resize();
      const ctx = canvas.getContext("2d");
      const width = 1920;
      const height = 1024;
      canvas.width = width;
      canvas.height = height;
      const cellSize = 32;
      const xCellCount = 100;
      const yCellCount = 100;

      const player = { x: 50, y: 50, health: 10 };
      const cameraWidth = width / cellSize;
      const cameraHeight = height / cellSize;

      const seed = Math.random();
      const seedInt = Math.floor(seed * 2 ** 32) >>> 0;
      let state = seedInt;
      console.log("Seed:", seed);

      class Cell {
        constructor(x, y, type, color) {
          this.x = x;
          this.y = y;
          this.type = type;
          this.color = {
            h: color.h,
            s: color.s,
            l: Math.max(0, Math.min(100, color.l + Math.round(hash(x, y) * 20) - 10)),
          };
        }
      }

      function getCellType() {
        return "grass";
      }

      const map = [];
      for (let y = 0; y < yCellCount; y++) {
        const row = [];
        for (let x = 0; x < xCellCount; x++) {
          const color = { h: random(0, 360), s: 100, l: 50 };
          row.push(new Cell(x, y, getCellType(), color));
        }
        map.push(row);
      }

      function render() {
        rect(0, 0, 100000, 100000);
        for (let x = 0; x < cameraWidth; x++) {
          for (let y = 0; y < cameraHeight; y++) {
            const cx = x + player.x - cameraWidth / 2;
            const cy = y + player.y - cameraHeight / 2;

            const color = hslToRgb(getTile(cx, cy).color);
            const rgb = `rgb(${color.r},${color.g},${color.b})`;
            rect(x * cellSize, y * cellSize, cellSize, cellSize, rgb);
          }
        }
      }

      function loop() {
        render();
        //requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    </script>
  </body>
</html>
