<!doctype html>
<html>
  <head>
    <title>Cool 2d Game</title>
    <meta name="viewport" />
    <style>
      canvas {
        display: block;
        image-rendering: pixelated;
        width: 90vw;
        height: auto;
        max-width: 90vw;
        max-height: 90vh;
        aspect-ratio: 1920 / 1024;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" style="width: 90vw; height: 90vh"></canvas>

    <script>
      // |-------------------------------|
      // |      START OF AI SECTION      |
      // |-------------------------------|

      function averageHSL(colors) {
        let sumX = 0;
        let sumY = 0;
        let sumS = 0;
        let sumL = 0;

        for (const { h, s, l } of colors) {
          const rad = (h * Math.PI) / 180;
          sumX += Math.cos(rad);
          sumY += Math.sin(rad);
          sumS += s;
          sumL += l;
        }

        const count = colors.length;
        const avgX = sumX / count;
        const avgY = sumY / count;

        // Convert averaged vector back to degrees
        let avgH = (Math.atan2(avgY, avgX) * 180) / Math.PI;
        if (avgH < 0) {
          avgH += 360;
        }

        return {
          h: avgH,
          s: sumS / count,
          l: sumL / count,
        };
      }

      // Returns a float in [0, 1), like Math.random(), but seeded
      function next() {
        state = (state + 0x6d2b79f5) >>> 0;
        let t = state;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }

      // Random float between min and max
      function r(min, max) {
        return min + next() * (max - min);
      }

      // Random integer between min and max, inclusive
      function random(min, max) {
        return Math.floor(r(min, max + 1));
      }

      function inBounds(x, y) {
        // written by AI

        return x >= 0 && x < xCellCount && y >= 0 && y < yCellCount;
      }

      function getTile(x, y) {
        // written by AI

        return inBounds(x, y) ? (map?.[y]?.[x] ?? null) : null; // null = outside the world
      }

      function setTile(x, y, id) {
        // written by AI

        if (inBounds(x, y)) map[y][x] = id;
      }

      function rect(x, y, width, height, color = "black", strokeColor = "black", strokeWidth = 0) {
        // written by AI
        ctx.fillStyle = color;
        ctx.fillRect(x, y, width, height);

        if (strokeWidth > 0) {
          ctx.lineWidth = strokeWidth;
          ctx.strokeStyle = strokeColor;
          ctx.strokeRect(x, y, width, height);
        }
      }

      function hash(x, y) {
        let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + seedInt) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
      }

      function resize() {
        // written by AI
        const scale = Math.min(window.innerWidth / canvas.width, window.innerHeight / canvas.height);
        canvas.style.width = canvas.width * scale + "px";
        canvas.style.height = canvas.height * scale + "px";
      }

      function hslToRgb({ h, s, l }) {
        // Normalize hue to [0, 360) and percentages to [0, 1]
        h = ((h % 360) + 360) % 360;
        s /= 100;
        l /= 100;

        const c = (1 - Math.abs(2 * l - 1)) * s;
        const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
        const m = l - c / 2;

        let r = 0,
          g = 0,
          b = 0;

        if (0 <= h && h < 60) {
          r = c;
          g = x;
          b = 0;
        } else if (60 <= h && h < 120) {
          r = x;
          g = c;
          b = 0;
        } else if (120 <= h && h < 180) {
          r = 0;
          g = c;
          b = x;
        } else if (180 <= h && h < 240) {
          r = 0;
          g = x;
          b = c;
        } else if (240 <= h && h < 300) {
          r = x;
          g = 0;
          b = c;
        } else if (300 <= h && h < 360) {
          r = c;
          g = 0;
          b = x;
        }

        return {
          r: Math.round((r + m) * 255),
          g: Math.round((g + m) * 255),
          b: Math.round((b + m) * 255),
        };
      }

      // |-----------------------------|
      // |      END OF AI SECTION      |
      // |-----------------------------|

      /**
       * Fills a rectangle on the map.
       *
       * @param sx - start x of the rectangle
       * @param sy - start y of the rectangle
       * @param ex - end x of the rectangle
       * @param ey - end y of the rectangle
       * @param type - type of tile to fill with
       */
      function fillRect(sx, sy, ex, ey, type) {
        for (let x = sx; x <= ex; x++) {
          for (let y = sy; y <= ey; y++) {
            setTile(x, y, new Cell(x, y, type));
          }
        }
      }

      let facing = { x: 0, y: -1 };

      const canvas = document.getElementById("canvas");
      window.addEventListener("resize", resize);
      resize();
      const ctx = canvas.getContext("2d");
      const width = 1920;
      const height = 1024;
      canvas.width = width;
      canvas.height = height;
      const cellSize = 32;
      const xCellCount = 100;
      const yCellCount = 100;

      let cameraX = 50;
      let cameraY = 50;

      const player = { x: 50, y: 50, health: 10 };
      const cameraWidth = width / cellSize;
      const cameraHeight = height / cellSize;

      const seed = Math.random();
      const seedInt = Math.floor(seed * 2 ** 32) >>> 0;
      let state = seedInt;
      console.log("Seed:", seed);

      class Cell {
        constructor(x, y, type, color = null) {
          if (color === null) color = getColor(type);
          this.x = x;
          this.y = y;
          this.type = type;
          this.color = color;
        }
        collision() {
          return ["wall", "barrier"].includes(this.type);
        }
        isBreakable() {
          return ["wall"].includes(this.type);
        }
      }

      function getColor(type) {
        switch (type) {
          case "wall":
            return {
              h: random(0, 10) + 20,
              s: random(0, 20) + 20,
              l: random(0, 10) + 15,
            };
          case "grass":
            return {
              h: random(0, 25) + 95,
              s: random(0, 25) + 40,
              l: random(0, 18) + 20,
            };
          default:
            return {
              h: random(0, 360),
              s: 0,
              l: 0,
            };
        }
      }

      function randomHsl() {
        return { h: random(0, 360), s: 100, l: random(40, 60) };
      }

      const map = Array.from({ length: yCellCount }, (_, y) => Array.from({ length: xCellCount }, (_, x) => new Cell(x, y, "wall")));

      fillRect(0, 0, xCellCount, yCellCount, "barrier");
      fillRect(1, 1, xCellCount - 2, yCellCount - 2, "grass");

      const initialBoulderCount = random(50, 75);
      for (let i = 0; i < initialBoulderCount; i++) {
        const width = random(1, 2);
        const sx = random(1, xCellCount - 2 - width);
        const sy = random(1, yCellCount - 2 - width);
        fillRect(sx, sy, sx + width, sy + width, "wall");
      }

      const enemies = [];
      const initialEnemyCount = random(5, 15);
      for (let i = 0; i < initialEnemyCount; i++) {
        spawnEnemy();
      }

      function checkEnemyCollisions(enemy, mx = 0, my = 0) {
        const ex = enemy.x + mx;
        const ey = enemy.y + my;
        for (const e of enemies) {
          if (enemy.id === e.id) continue;
          if (ex === e.x && ey === e.y) return true;
        }
        return false;
      }

      function getEnemyMap() {
        const eMap = Array.from({ length: yCellCount }, (_, y) => Array.from({ length: xCellCount }, (_, x) => false));
        for (const e of enemies) {
          eMap[e.y][e.x] = true;
        }
        return eMap;
      }

      /**
       * Takes the map and fills it out with the directions to the next place to go to
       *
       * @param map a 1d array, each item is the corrosponding map cell type, "wall", "grass", etc
       * @returns map a 2d array, each item is 1 row (array), each row has the direction the enemy should go to get closer to the player
       */
      function fillBfs(map) {
        const enemyMap = getEnemyMap(enemies);
        const scannedTiles = { [`${player.x},${player.y}`]: { x: player.x, y: player.y, distance: 0, move: { x: 0, y: 0 } } };
        const edgeTiles = [{ x: player.x, y: player.y, distance: 0, move: { x: 0, y: 0 } }];
        while (edgeTiles.length > 0) {
          const cell = edgeTiles.shift();
          if (cell.y > 0 && !getTile(cell.x, cell.y - 1).collision() && scannedTiles[`${cell.x},${cell.y - 1}`] === undefined) {
            scannedTiles[`${cell.x},${cell.y - 1}`] = { x: cell.x, y: cell.y - 1, distance: cell.distance + 1, move: { x: 0, y: 1 } };
            edgeTiles.push({ x: cell.x, y: cell.y - 1, distance: cell.distance + 1, move: { x: 0, y: 1 } });
          }
          if (cell.y < yCellCount - 1 && !getTile(cell.x, cell.y + 1).collision() && scannedTiles[`${cell.x},${cell.y + 1}`] === undefined) {
            scannedTiles[`${cell.x},${cell.y + 1}`] = { x: cell.x, y: cell.y + 1, distance: cell.distance + 1, move: { x: 0, y: -1 } };
            edgeTiles.push({ x: cell.x, y: cell.y + 1, distance: cell.distance + 1, move: { x: 0, y: -1 } });
          }
          if (cell.x > 0 && !getTile(cell.x - 1, cell.y).collision() && scannedTiles[`${cell.x - 1},${cell.y}`] === undefined) {
            scannedTiles[`${cell.x - 1},${cell.y}`] = { x: cell.x - 1, y: cell.y, distance: cell.distance + 1, move: { x: 1, y: 0 } };
            edgeTiles.push({ x: cell.x - 1, y: cell.y, distance: cell.distance + 1, move: { x: 1, y: 0 } });
          }
          if (cell.x < xCellCount - 1 && !getTile(cell.x + 1, cell.y).collision() && scannedTiles[`${cell.x + 1},${cell.y}`] === undefined) {
            scannedTiles[`${cell.x + 1},${cell.y}`] = { x: cell.x + 1, y: cell.y, distance: cell.distance + 1, move: { x: -1, y: 0 } };
            edgeTiles.push({ x: cell.x + 1, y: cell.y, distance: cell.distance + 1, move: { x: -1, y: 0 } });
          }
        }
        const bfsMap = Array.from({ length: yCellCount }, (_, y) => Array.from({ length: xCellCount }, (_, x) => ({ x: 0, y: 0, distance: 0 })));
        for (let item of Object.values(scannedTiles)) {
          bfsMap[item.y][item.x] = { x: item.move.x, y: item.move.y, distance: item.distance };
        }
        return bfsMap;
      }

      function enemyPathfind(enemy, px = player.x, py = player.y) {
        const possibleMoves = [];
        if (enemy.y > 0 && !getTile(enemy.x, enemy.y - 1)?.collision() && !checkEnemyCollisions(enemy, 0, -1)) {
          possibleMoves.push({ x: 0, y: -1 });
        }
        if (enemy.y < yCellCount - 1 && !getTile(enemy.x, enemy.y + 1)?.collision() && !checkEnemyCollisions(enemy, 0, 1)) {
          possibleMoves.push({ x: 0, y: 1 });
        }
        if (enemy.x > 0 && !getTile(enemy.x - 1, enemy.y)?.collision() && !checkEnemyCollisions(enemy, -1, 0)) {
          possibleMoves.push({ x: -1, y: 0 });
        }
        if (enemy.x < xCellCount - 1 && !getTile(enemy.x + 1, enemy.y)?.collision() && !checkEnemyCollisions(enemy, 1, 0)) {
          possibleMoves.push({ x: 1, y: 0 });
        }
        if (possibleMoves.length === 0) return;
        let bestMove = null;
        const x = enemy.x;
        const y = enemy.y;
        let closestDistance = (x - px) * (x - px) + (y - py) * (y - py);
        for (const move of possibleMoves) {
          const x = enemy.x + move.x;
          const y = enemy.y + move.y;
          const distance = (x - px) * (x - px) + (y - py) * (y - py);
          if (distance < closestDistance) {
            bestMove = move;
            closestDistance = distance;
          }
        }
        if (!bestMove) return;
        enemy.x += bestMove.x;
        enemy.y += bestMove.y;
        return enemy;
      }

      function spawnEnemy(health = 5, x = random(0, xCellCount), y = random(0, yCellCount), push = true) {
        const enemy = {};
        enemy.id = crypto.randomUUID();
        enemy.health = health;
        enemy.x = x;
        enemy.y = y;
        enemy.maxHealth = health;
        if (push) enemies.push(enemy);
        return enemy;
      }

      const keys = {};

      window.addEventListener("keydown", (event) => {
        keys[event.key.toLowerCase()] = true;
      });

      window.addEventListener("keyup", (event) => {
        keys[event.key.toLowerCase()] = false;
      });

      let playerMoved = false;
      lastMove = performance.now();

      function handleMovement() {
        if (performance.now() - lastMove < 100) return;
        if (!playerMoved) {
          if (keys.w && player.y > 0) {
            facing = { x: 0, y: -1 };
            if (!getTile(player.x, player.y - 1)?.collision()) {
              playerMoved = true;
              player.y -= 1;
            }
            lastMove = performance.now();
          } else if (keys.s && player.y < yCellCount - 1) {
            if (!getTile(player.x, player.y + 1)?.collision()) {
              playerMoved = true;
              player.y += 1;
            }

            lastMove = performance.now();
            facing = { x: 0, y: 1 };
          } else if (keys.a && player.x > 0) {
            if (!getTile(player.x - 1, player.y)?.collision()) {
              playerMoved = true;
              player.x -= 1;
            }

            lastMove = performance.now();
            facing = { x: -1, y: 0 };
          } else if (keys.d && player.x < xCellCount - 1) {
            if (!getTile(player.x + 1, player.y)?.collision()) {
              playerMoved = true;
              player.x += 1;
            }

            lastMove = performance.now();
            facing = { x: 1, y: 0 };
          }
        }
        if (keys[" "]) {
          playerPlaceBlock();
          lastMove = performance.now();
        }
      }

      function playerPlaceBlock() {
        const spot = { x: player.x + facing.x, y: player.y + facing.y };
        if (getTile(spot.x, spot.y).type === "grass") {
          placeBlock(spot.x, spot.y, "wall");
        } else if (getTile(spot.x, spot.y).isBreakable()) {
          breakBlock(spot.x, spot.y);
        }
      }

      function placeBlock(x, y, type) {
        setTile(x, y, new Cell(x, y, type));
      }

      function breakBlock(x, y) {
        setTile(x, y, new Cell(x, y, "grass"));
      }

      function render() {
        rect(0, 0, 100000, 100000);
        for (let x = 0; x < cameraWidth; x++) {
          for (let y = 0; y < cameraHeight; y++) {
            const cx = x + cameraX - cameraWidth / 2;
            const cy = y + cameraY - cameraHeight / 2;
            if (cx === player.x && cy === player.y) {
              rect(x * cellSize, y * cellSize, cellSize, cellSize, "black");
              continue;
            }
            const color = hslToRgb(getTile(cx, cy).color);
            const rgb = `rgb(${color.r},${color.g},${color.b})`;
            rect(x * cellSize, y * cellSize, cellSize, cellSize, rgb);
          }
        }
        for (const enemy of enemies) {
          const color = "rgb(" + Math.floor(255 * (enemy.health / enemy.maxHealth)) + ",0,0)";
          const rx = enemy.x - cameraX + cameraWidth / 2;
          const ry = enemy.y - cameraY + cameraHeight / 2;
          rect(rx * cellSize, ry * cellSize, cellSize, cellSize, color);
        }
      }

      function damagePlayer() {
        for (const enemy of enemies) {
          if (enemy.x === player.x && enemy.y === player.y) {
            player.health -= 1;
            let foundValidSpot = false;
            let i = 0;
            while (!foundValidSpot) {
              i++;
              if (i > 100) foundValidSpot = true;
              player.x = random(1, xCellCount - 2);
              player.y = random(1, yCellCount - 2);
              if (!getTile(player.x, player.y)?.collision() && !checkEnemyCollisions(player)) foundValidSpot = true;
            }
            break;
          }
        }
      }

      function updateEnemies() {
        playerMoved = false;
        const bfsMap = fillBfs(map);

        for (let enemy of enemies) {
          const enemyMap = getEnemyMap();
          //enemy = enemyPathfind(enemy);
          const move = bfsMap[enemy.y][enemy.x];
          if (move.x === 0 && move.y === 0) {
            const possibleMoves = [];
            for (const [dx, dy] of [
              [-1, 0],
              [1, 0],
              [0, 1],
              [0, -1],
            ]) {
              const e = enemyMap[enemy.y + dy][enemy.x + dx];
              const t = getTile(enemy.x + dx, enemy.y + dy);
              if (!t.collision() && !e) possibleMoves.push({ x: dx, y: dy });
            }
            if (possibleMoves.length > 0) {
              const r = random(0, possibleMoves.length - 1);
              enemy.x += possibleMoves[r].x;
              enemy.y += possibleMoves[r].y;
            }
          }
          if (!enemyMap[enemy.y + move.y]?.[enemy.x + move.x]) {
            enemy.x += move.x;
            enemy.y += move.y;
            continue;
          }
          let bestDist = bfsMap[enemy.y][enemy.x].distance;
          let bestMove = { x: 0, y: 0 };
          for (const [dx, dy] of [
            [-1, 0],
            [1, 0],
            [0, 1],
            [0, -1],
          ]) {
            if (dx === move.x && dy === move.y) continue;
            const nX = enemy.x + dx;
            const nY = enemy.y + dy;
            if (nX >= 0 && nY >= 0 && nX <= xCellCount - 1 && nY <= yCellCount - 1 && bestDist > bfsMap[nY][nX].distance && !enemyMap[nY][nX]) {
              console.log(nX, nY, bfsMap[nY][nX]);
              bestDist = bfsMap[nY][nX].distance;
              bestMove = { x: dX, y: dY };
            }
          }
          enemy.x += bestMove.x;
          enemy.y += bestMove.y;
        }
      }

      function loop() {
        // remove later
        if (playerMoved) {
          updateEnemies();
        } else {
          handleMovement();
        }
        damagePlayer();
        cameraX = Math.max(cameraWidth / 2, Math.min(xCellCount - cameraWidth / 2, player.x));
        cameraY = Math.max(cameraHeight / 2, Math.min(yCellCount - cameraHeight / 2, player.y));
        render();
        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    </script>
  </body>
</html>
